# 用户主题词典
#
# 会与内置词表合并（用户词条优先）。用得越久越准。
# include：命中即加分；exclude：命中即排除（优先级高于 include）
#
# 修改后立即生效，无需重启。

topics:
  摄影:
    include: [镜头, 构图, 布光, 相机, 调色, 后期, 光圈, 快门]
    exclude: [手机评测]

  理财:
    include: [基金, 利率, 资产配置, 定投, 收益率, 美债, 可转债]
    exclude: [带货, 广告, 荐股]

  # 按需添加自己的主题，例如：
  # 半导体:
  #   include: [晶圆, 制程, 光刻, 封装, 良率]
  #   exclude: []
